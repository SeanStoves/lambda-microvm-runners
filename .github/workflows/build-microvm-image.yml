name: Build MicroVM Image

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    # arm runner because the image is arm64. No emulation, no surprises.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # githubOidcRoleArn from the stack outputs
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Build MicroVM image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          MICROVM_CODE_BUCKET: ${{ vars.MICROVM_CODE_BUCKET }}
          MICROVM_BUILD_ROLE_ARN: ${{ vars.MICROVM_BUILD_ROLE_ARN }}
        run: npx tsx scripts/build-microvm-image.ts
